name: detection-platform

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: detections
    ports:
      - "5432:5432"
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d # also creates the detections_test database
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 15

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/detections
      INGEST_API_KEY: dev-ingest-key
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
